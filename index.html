<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanvee's Cloud POS & Profit Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase App & Realtime Database CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <!-- Navbar -->
    <nav class="bg-blue-600 p-4 text-white shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">Sanvee's Cloud POS & Profit Tracker</h1>
        <div id="authSection">
            <button onclick="openLoginModal()" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-bold shadow hover:bg-gray-100 transition">অ্যাডমিন লগইন</button>
        </div>
    </nav>

    <div class="container mx-auto p-4 grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- POS & Daily Entry Section -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-bold mb-4 text-gray-800">ডেইলি এন্ট্রি ও সেলস</h2>
            <form id="posForm" onsubmit="handlePosSubmit(event)">
                <div class="mb-3">
                    <label class="block text-gray-700 text-sm font-bold mb-1">প্রোডাক্টের নাম</label>
                    <input type="text" id="productName" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-3 grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">ক্রয় মূল্য (Buying)</label>
                        <input type="number" id="buyingPrice" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-1">বিক্রয় মূল্য (Selling)</label>
                        <input type="number" id="sellingPrice" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-700 transition">এন্ট্রি যোগ করুন</button>
            </form>
        </div>

        <!-- Admin & Password Change Section (Hidden by default) -->
        <div id="adminPanel" class="bg-white p-6 rounded-xl shadow-md hidden">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-800">অ্যাডমিন সেটিংস</h3>
                <button onclick="handleLogout()" class="bg-red-500 text-white px-3 py-1 rounded text-sm">লগআউট</button>
            </div>
            
            <form id="passwordChangeForm" onsubmit="changeAdminPassword(event)">
                <div class="mb-3">
                    <label class="block text-gray-700 text-sm font-bold mb-1">বর্তমান পাসওয়ার্ড</label>
                    <input type="password" id="currentPassword" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-3">
                    <label class="block text-gray-700 text-sm font-bold mb-1">নতুন পাসওয়ার্ড</label>
                    <input type="password" id="newPassword" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-3">
                    <label class="block text-gray-700 text-sm font-bold mb-1">কনফার্ম নতুন পাসওয়ার্ড</label>
                    <input type="password" id="confirmPassword" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition">পাসওয়ার্ড আপডেট করুন</button>
            </form>
        </div>

    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center hidden">
        <div class="bg-white p-6 rounded-xl shadow-lg w-80">
            <h3 class="text-lg font-bold mb-4">অ্যাডমিন লগইন</h3>
            <input type="password" id="loginPasswordInput" placeholder="পাসওয়ার্ড দিন" class="w-full px-3 py-2 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <div class="flex justify-end space-x-2">
                <button onclick="closeLoginModal()" class="px-4 py-2 bg-gray-300 rounded-lg">বাতিল</button>
                <button onclick="verifyAdminLogin()" class="px-4 py-2 bg-blue-600 text-white rounded-lg">লগইন</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Firebase Configuration (আপনার নিজস্ব ফায়ারবেস ক্রেডেনশিয়াল এখানে বসাবেন)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Check Session on Load
        window.onload = function() {
            if (sessionStorage.getItem("isAdminLoggedIn") === "true") {
                showAdminPanel();
            }
        }

        function openLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        async function verifyAdminLogin() {
            const enteredPass = document.getElementById('loginPasswordInput').value;
            
            try {
                const snapshot = await db.ref('settings/adminPassword').once('value');
                const correctPassword = snapshot.val() || "project420"; // ডিফল্ট পাসওয়ার্ড project420

                if (enteredPass === correctPassword) {
                    sessionStorage.setItem("isAdminLoggedIn", "true");
                    closeLoginModal();
                    showAdminPanel();
                    alert("লগইন সফল হয়েছে!");
                } else {
                    alert("ভুল পাসওয়ার্ড!");
                }
            } catch (error) {
                console.error(error);
                alert("লগইন করতে সমস্যা হয়েছে।");
            }
        }

        function showAdminPanel() {
            document.getElementById('adminPanel').classList.remove('hidden');
            document.getElementById('authSection').innerHTML = `<span class="text-green-300 font-bold">অ্যাডমিন সক্রিয়</span>`;
        }

        function handleLogout() {
            sessionStorage.removeItem("isAdminLoggedIn");
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('authSection').innerHTML = `<button onclick="openLoginModal()" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-bold shadow hover:bg-gray-100 transition">অ্যাডমিন লগইন</button>`;
            alert("লগআউট সফল হয়েছে!");
        }

        // পাসওয়ার্ড পরিবর্তনের ফাংশন
        async function changeAdminPassword(event) {
            event.preventDefault();

            const currentPass = document.getElementById('currentPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            if (newPass !== confirmPass) {
                alert("নতুন পাসওয়ার্ড এবং কনফার্ম পাসওয়ার্ড এক হয়নি!");
                return;
            }

            try {
                const dbRef = db.ref('settings/adminPassword');
                const snapshot = await dbRef.once('value');
                const savedPassword = snapshot.val() || "project420";

                if (currentPass !== savedPassword) {
                    alert("বর্তমান পাসওয়ার্ড ভুল রয়েছে!");
                    return;
                }

                await dbRef.set(newPass);
                alert("পাসওয়ার্ড সফলভাবে পরিবর্তিত হয়েছে!");
                document.getElementById('passwordChangeForm').reset();
            } catch (error) {
                console.error(error);
                alert("পাসওয়ার্ড পরিবর্তন করা সম্ভব হয়নি।");
            }
        }

        // সাধারণ POS এন্ট্রি ফাংশন
        function handlePosSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('productName').value;
            const buying = document.getElementById('buyingPrice').value;
            const selling = document.getElementById('sellingPrice').value;

            db.ref('salesEntries').push({
                productName: name,
                buyingPrice: buying,
                sellingPrice: selling,
                timestamp: Date.now()
            }).then(() => {
                alert("এন্ট্রি সফলভাবে সংরক্ষিত হয়েছে!");
                document.getElementById('posForm').reset();
            }).catch((err) => {
                alert("এন্ট্রি সেভ করতে সমস্যা হয়েছে: " + err.message);
            });
        }
    </script>
</body>
</html>
