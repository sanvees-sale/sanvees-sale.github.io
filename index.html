<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Sales Breakdown Table</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .img-compact {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 8px;
    }
  </style>
</head>
<body class="bg-slate-100 p-4 font-sans text-slate-800">

  <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-slate-200">
    
    <!-- Top Header & Search Bar -->
    <div class="bg-slate-950 text-white p-4 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-list-check text-amber-500"></i>
        <h1 class="font-bold text-base">Daily Sales Breakdown Table</h1>
      </div>

      <div class="flex items-center gap-3">
        <!-- Date Picker -->
        <input type="date" id="input-sale-date" onchange="renderDailyView()" class="bg-slate-900 text-white text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 outline-none">
        
        <!-- Price Search Input -->
        <div class="flex items-center bg-amber-500 text-slate-950 rounded-lg px-3 py-1 font-bold text-xs gap-2">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>Price Search:</span>
          <input type="number" id="input-price-search" oninput="filterDailyTableByPrice()" placeholder="e.g. 1850" class="w-20 bg-white text-slate-900 rounded px-2 py-0.5 outline-none font-bold text-xs">
        </div>

        <button onclick="clearSearch()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-3 py-1.5 rounded-lg border border-slate-700 transition">Clear</button>
      </div>
    </div>

    <!-- Info Bar -->
    <div class="px-4 py-2 bg-slate-50 border-b border-slate-200 flex justify-between items-center text-xs">
      <div id="summary-header-date" class="font-bold text-slate-700">Date: --</div>
      <div class="flex items-center gap-2">
        <span class="font-bold text-slate-600">Daily Costing:</span>
        <input type="number" id="input-daily-costing" value="0" onchange="renderDailyView()" class="w-20 border border-slate-300 rounded px-2 py-1 text-xs outline-none focus:border-amber-500">
      </div>
    </div>

    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead class="bg-slate-50 text-slate-500 text-[11px] font-bold uppercase tracking-wider border-b border-slate-200">
          <tr>
            <th class="p-3.5 text-center">SL</th>
            <th class="p-3.5">PICTURE</th>
            <th class="p-3.5">INFO & EDITABLE QTY</th>
            <th class="p-3.5">FINANCIALS</th>
            <th class="p-3.5">DESCRIPTION</th>
            <th class="p-3.5 text-center">ACTION</th>
          </tr>
        </thead>
        <tbody id="tbody-daily-sales">
          <!-- Dynamic Content -->
        </tbody>
      </table>
    </div>

    <!-- Bottom Summary Cards -->
    <div class="bg-slate-50 p-4 border-t border-slate-200 grid grid-cols-2 md:grid-cols-5 gap-3 text-center text-xs">
      <div class="p-2.5 bg-white rounded-lg border border-slate-200 shadow-sm">
        <span class="text-slate-400 block text-[10px] font-bold">TOTAL QTY</span>
        <span id="summary-qty" class="text-slate-900 font-black text-sm">0 Pcs</span>
      </div>
      <div class="p-2.5 bg-white rounded-lg border border-slate-200 shadow-sm">
        <span class="text-slate-400 block text-[10px] font-bold">GROSS PROFIT</span>
        <span id="summary-gross-profit" class="text-slate-900 font-black text-sm">৳ 0</span>
      </div>
      <div class="p-2.5 bg-white rounded-lg border border-slate-200 shadow-sm">
        <span class="text-slate-400 block text-[10px] font-bold">COSTING</span>
        <span id="summary-costing" class="text-slate-900 font-black text-sm">৳ 0</span>
      </div>
      <div class="p-2.5 bg-white rounded-lg border border-slate-200 shadow-sm">
        <span class="text-slate-400 block text-[10px] font-bold">PER PROD COST</span>
        <span id="summary-per-product-cost" class="text-slate-900 font-black text-sm">৳ 0</span>
      </div>
      <div class="p-2.5 bg-white rounded-lg border border-slate-200 shadow-sm">
        <span class="text-slate-400 block text-[10px] font-bold">NET PROFIT</span>
        <span id="summary-total-profit" class="text-emerald-600 font-black text-sm">৳ 0</span>
      </div>
    </div>

  </div>

  <script>
    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('input-sale-date').value = todayStr;

    // স্যাম্পল প্রোডাক্ট ডাটা (আপনার অরিজিনাল ডাটা দিয়ে এগুলো রিপ্লেস হবে)
    let products = [
      { id: 1, selling: 1850, buying: 1300, image: "https://via.placeholder.com/50", desc: "কাপড় টা হাতে পেয়ে খুশি হয়ে যাবেন" },
      { id: 2, selling: 1850, buying: 1350, image: "https://via.placeholder.com/50", desc: "তাাঁতীর নিখুঁত হাতে বুনা জামদানী" },
      { id: 3, selling: 3050, buying: 1850, image: "https://via.placeholder.com/50", desc: "অরিজিনাল ইন্ডিয়ান দিল্লি কটন ❤️" }
    ];

    let sales = [];

    // ১. Table Render Function
    function renderDailyView() {
      const date = document.getElementById('input-sale-date').value || todayStr;
      document.getElementById('summary-header-date').innerText = `Date: ${date}`;

      const tbody = document.getElementById('tbody-daily-sales');
      if (products.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400 text-xs">No products added yet.</td></tr>`;
      } else {
        let totalQty = 0;
        let totalGrossProfit = 0;

        tbody.innerHTML = products.map((p, idx) => {
          const s = sales.find(item => item.date === date && item.productId === p.id);
          const qty = s ? s.qty : 0;
          const grossProfit = s ? s.grossProfit : 0;

          totalQty += qty;
          totalGrossProfit += grossProfit;

          return `
            <tr data-sell-price="${p.selling}" class="hover:bg-slate-50/80 transition border-b border-slate-100">
              <td class="p-3.5 text-center font-bold text-slate-400">${idx + 1}</td>
              <td class="p-3.5"><img src="${p.image}" class="img-compact shadow-2xs"></td>
              <td class="p-3.5">
                <div class="flex items-center gap-2 mb-1.5">
                  <span class="text-xs font-bold text-slate-700">Qty:</span>
                  <input type="number" min="0" value="${qty}" onchange="updateSaleQty(${p.id}, this.value)" class="w-16 border border-slate-200 rounded-lg p-1 text-xs font-black text-slate-900 bg-amber-50/60 text-center outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500">
                  <span class="text-xs font-bold text-slate-500">Pcs</span>
                </div>
                <div class="text-[11px] font-semibold text-slate-600">
                  <span class="bg-amber-100/80 text-amber-900 px-2 py-0.5 rounded-md font-extrabold">Sell: ৳${p.selling}</span>
                  <span class="ml-1.5 text-slate-500">Buy: ৳${p.buying}</span>
                </div>
              </td>
              <td class="p-3.5 font-extrabold text-xs text-slate-900">৳ ${grossProfit}</td>
              <td class="p-3.5 text-xs text-slate-600 leading-relaxed">${p.desc || ''}</td>
              <td class="p-3.5 text-center no-print">
                <button onclick="deleteProduct(event, ${p.id})" class="text-rose-400 hover:text-rose-600 p-2 transition rounded-xl hover:bg-rose-50" title="Delete Product"><i class="fa-solid fa-trash-can"></i></button>
              </td>
            </tr>
          `;
        }).join('');

        const costing = parseFloat(document.getElementById('input-daily-costing').value) || 0;
        const perProdCost = totalQty > 0 ? (costing / totalQty).toFixed(2) : 0;
        const totalProfit = totalGrossProfit - costing;

        document.getElementById('summary-qty').innerText = `${totalQty} Pcs`;
        document.getElementById('summary-gross-profit').innerText = `৳ ${totalGrossProfit}`;
        document.getElementById('summary-costing').innerText = `৳ ${costing}`;
        document.getElementById('summary-per-product-cost').innerText = `৳ ${perProdCost}`;
        document.getElementById('summary-total-profit').innerText = `৳ ${totalProfit}`;
      }

      filterDailyTableByPrice();
    }

    // ২. Price Filter Function (Only Selling Price Search)
    function filterDailyTableByPrice() {
      const searchValue = document.getElementById('input-price-search').value.trim();
      const tbody = document.getElementById('tbody-daily-sales');
      if (!tbody) return;

      const rows = tbody.querySelectorAll('tr');
      rows.forEach(row => {
        if (!searchValue) {
          row.style.display = '';
          return;
        }

        const sellPrice = row.getAttribute('data-sell-price');
        if (sellPrice && sellPrice.includes(searchValue)) {
          row.style.display = '';
        } else {
          row.style.display = 'none';
        }
      });
    }

    // Qty আপডেট
    function updateSaleQty(productId, val) {
      const qty = parseInt(val) || 0;
      const date = document.getElementById('input-sale-date').value || todayStr;
      const product = products.find(p => p.id === productId);
      
      let s = sales.find(item => item.date === date && item.productId === productId);
      if (s) {
        s.qty = qty;
        s.grossProfit = qty * (product.selling - product.buying);
      } else {
        sales.push({
          date: date,
          productId: productId,
          qty: qty,
          grossProfit: qty * (product.selling - product.buying)
        });
      }
      renderDailyView();
    }

    // ডিলিট ফাংশন
    function deleteProduct(e, id) {
      e.stopPropagation();
      products = products.filter(p => p.id !== id);
      renderDailyView();
    }

    // সার্চ ক্লিয়ার ফাংশন
    function clearSearch() {
      document.getElementById('input-price-search').value = '';
      filterDailyTableByPrice();
    }

    // প্রথমবার রেন্ডার
    renderDailyView();
  </script>
</body>
</html>
